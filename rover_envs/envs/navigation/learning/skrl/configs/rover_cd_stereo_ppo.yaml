seed: 42

models:
  separate: False
  policy:
    type: "GaussianPolicyCDConv"
    params:
      mlp_input_size: 5
      mlp_layers: [256, 160, 128]
      mlp_activation: "leaky_relu"
      encoder_input_size: 115200
      encoder_input_shape: [180, 320, 2]
      encoder_layers: [8, 16, 32, 64]
      encoder_activation: "leaky_relu"
  value:
    type: "ValueNetworkCDConv"
    params:
      mlp_input_size: 5
      mlp_layers: [256, 160, 128]
      mlp_activation: "leaky_relu"
      encoder_input_size: 115200
      encoder_input_shape: [180, 320, 2]
      encoder_layers: [8, 16, 32, 64]
      encoder_activation: "leaky_relu"

agent:
  rollouts: 60
  learning_epochs: 4
  mini_batches: 60
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.e-4
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.008
  experiment:
    directory: "rover"
    experiment_name: "cd_stereo"
    write_interval: 40
    checkpoint_interval: 400
    wandb: True

trainer:
  environment_info: log
  timesteps: 2000000
