x-default-isaac-lab-volumes:
  &default-isaac-lab-volumes
    # These volumes follow from this page
    # https://docs.omniverse.nvidia.com/app_isaacsim/app_isaacsim/install_faq.html#save-isaac-sim-configs-on-local-disk
    # Note: Using /home/isaac-sim paths since container runs as isaac-sim user (uid 1234)
    - type: volume
      source: isaac-cache-kit
      target: /isaac-sim/kit/cache
    - type: volume
      source: isaac-cache-ov
      target: /home/isaac-sim/.cache/ov
    - type: volume
      source: isaac-cache-pip
      target: /home/isaac-sim/.cache/pip
    - type: volume
      source: isaac-cache-gl
      target: /home/isaac-sim/.cache/nvidia/GLCache
    - type: volume
      source: isaac-cache-compute
      target: /home/isaac-sim/.nv/ComputeCache
    - type: volume
      source: isaac-logs
      target: /home/isaac-sim/.nvidia-omniverse/logs
    - type: volume
      source: isaac-carb-logs
      target: /isaac-sim/kit/logs/Kit/Isaac-Sim
    - type: volume
      source: isaac-data
      target: /home/isaac-sim/.local/share/ov/data
    - type: volume
      source: isaac-docs
      target: /home/isaac-sim/Documents
      # These volumes allow X11 Forwarding
    # - type: bind
      # source: /tmp/.X11-unix
      # target: /tmp/.X11-unix
    - type: bind
      source: ${HOME}/.Xauthority
      target: /home/isaac-sim/.Xauthority
    - type: bind
      source: ../
      target: /workspace/rlroverlab/


x-default-isaac-lab-deploy:
  &default-isaac-lab-deploy
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [ gpu ]


x-default-isaac-lab-enviroment:
  &default-isaac-lab-environment
    ISAAC_SIM_PATH: /isaac-sim
    DISPLAY: ${DISPLAY}
    OMNI_KIT_ALLOW_ROOT: 1
    ACCEPT_EULA: Y
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTRTPS_DEFAULT_PROFILES_FILE: /root/.ros/fastdds.xml
    CYCLONEDDS_URI: /root/.ros/cyclonedds.xml
    RLROVERLAB_PATH: /workspace/rlroverlab/
    PYTHONPATH: /workspace/rlroverlab:${PYTHONPATH}



services:
  rover-lab-base:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - ISAAC_SIM_VERSION=${ISAAC_SIM_VERSION:-6.0.0-dev2}
        - ISAAC_LAB_GIT_URL=${ISAAC_LAB_GIT_URL:-https://github.com/isaac-sim/IsaacLab.git}
        - ISAAC_LAB_GIT_REF=${ISAAC_LAB_GIT_REF:-a4a7602}
        - ISAAC_SIM_PATH=/isaac-sim
        - USER_HOME=/root
    image: rover-lab-base
    container_name: rover-lab-base
    environment: *default-isaac-lab-environment
    volumes: *default-isaac-lab-volumes
    network_mode: host
    deploy: *default-isaac-lab-deploy
    entrypoint: /workspace/rlroverlab/docker/entrypoint.sh
    command: bash
    stdin_open: true
    tty: true

  rover-lab-ros2:
    env_file:
      - .env.ros2
    build:
      context: ../
      dockerfile: docker/Dockerfile.ros2
      args:
        - USER_HOME=/root
        - ISAAC_SIM_PATH=/isaac-sim
    image: rover-lab-ros2
    container_name: rover-lab-ros2
    environment: *default-isaac-lab-environment
    volumes: *default-isaac-lab-volumes
    network_mode: host
    deploy: *default-isaac-lab-deploy
    entrypoint: /workspace/rlroverlab/docker/entrypoint.sh
    command: bash
    stdin_open: true
    tty: true


volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-logs:
  isaac-carb-logs:
  isaac-data:
  isaac-docs:
  orbit-docs:
  orbit-logs:
  orbit-data:
